server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/contador-v2/public;
    index index.php index.html;

    client_max_body_size 25M;
    charset utf-8;

    # Cabeçalhos de segurança básicos
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Roteamento SPA (React) e Endpoints da API Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Arquivos estáticos do build do Vite (cache longo)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Processamento PHP FastCGI
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;

        # O socket PHP-FPM é detectado automaticamente pelo script de provisionamento
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bloqueio de arquivos ocultos (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
